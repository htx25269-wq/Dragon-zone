<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Stats</title>

<style>
body{
margin:0;
font-family:Arial, sans-serif;
background:#050505;
color:#fff;
}

/* HERO */
.hero{
height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
}

.hero h1{
font-size:3rem;
color:#ff2a2a;
text-shadow:0 0 20px red;
}

.btn{
margin-top:20px;
padding:12px 25px;
background:#ff2a2a;
color:#fff;
text-decoration:none;
border-radius:8px;
transition:.3s;
}

.btn:hover{
background:#ff0000;
box-shadow:0 0 20px red;
}

/* STATS */
.stats{
padding:100px 10%;
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
background:#080808;
}

.stat-box{
background:rgba(255,255,255,.05);
border:1px solid rgba(255,0,0,.3);
backdrop-filter:blur(10px);
padding:30px;
text-align:center;
border-radius:15px;
transition:.3s;
}

.stat-box:hover{
transform:translateY(-10px);
box-shadow:0 0 25px rgba(255,0,0,.5);
}

.stat-box h2{
font-size:3rem;
color:#ff2a2a;
text-shadow:0 0 15px red;
}

.stat-box p{
margin-top:10px;
font-size:1.1rem;
}
</style>
</head>

<body>

<!-- HERO SECTION -->
<section class="hero">
<h1>Cyber Ethical Zone</h1>
<p>Welcome to modern cyber learning platform</p>

<a href="#stats" class="btn">Explore</a>
</section>

<!-- STATS SECTION -->
<section id="stats" class="stats">

<div class="stat-box">
<h2>20K+</h2>
<p>Community Members</p>
</div>

<div class="stat-box">
<h2>100+</h2>
<p>Courses</p>
</div>

<div class="stat-box">
<h2>500+</h2>
<p>Articles</p>
</div>

<div class="stat-box">
<h2>24/7</h2>
<p>Support</p>
</div>

</section>

</body>
</html>
