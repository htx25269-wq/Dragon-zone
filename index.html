<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOICE OF DRAGON KINGS</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Roboto:wght@400;500&display=swap');

:root { --gold: #d4af37; }

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Roboto',sans-serif;
    background:#000;
    color:#eee;
}

header{
    background:#000;
    padding:15px 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:2px solid var(--gold);
}

.hero{
    height:320px;
    background: linear-gradient(rgba(0,0,0,.75),rgba(0,0,0,.9)),
                url('banner.jpg') center/cover;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    color:var(--gold);
    font-size:28px;
    font-weight:bold;
}

.card{
    margin-bottom:25px;
    background:#111;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 15px rgba(212,175,55,0.1);
}

.card-img{
    height:200px;
    background-size:cover;
    background-position:center;
}

button{
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#d4af37;
    color:#000;
}

/* Modal */
.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    align-items: center;
    justify-content: center;
}

.modal-content {
    background: #111;
    padding: 25px;
    border-radius: 12px;
    max-width: 85%;
    border: 2px solid var(--gold);
    color: #eee;
}
</style>
</head>

<body>

<header>
    <div style="display:flex;align-items:center;gap:12px;">
        <span style="font-size:32px;">🗡️</span>
        <div style="color:var(--gold);">
            VOICE OF<br>
            <span style="color:#fff;font-size:23px;">DRAGON KINGS</span>
        </div>
    </div>
    <div style="color:var(--gold);font-size:28px;">☰</div>
</header>

<div class="hero">
    VOICE OF DRAGON KINGS
</div>

<div style="padding:20px 15px;">

<h2 style="text-align:center;color:var(--gold);margin:25px 0;">
SUBJECTS
</h2>

<!-- Tawhid -->
<div class="card">
    <div class="card-img" style="background-image:url('image1.jpg');"></div>
    <div style="padding:20px;">
        <h3 style="color:var(--gold);">Tawhid<br><small style="color:#aaa;">তাওহীদ</small></h3>
        <button onclick="openModal('tawhid')" 
        style="background:#222;color:var(--gold);border:none;padding:14px;width:100%;margin-top:12px;border-radius:8px;">
        READ MORE
        </button>
    </div>
</div>

<!-- Aqidah -->
<div class="card">
    <div class="card-img" style="background-image:url('image2.jpg');"></div>
    <div style="padding:20px;">
        <h3 style="color:var(--gold);">Aqidah & Manhaz<br><small style="color:#aaa;">আকীদাহ এবং মানহাজ</small></h3>
        <button onclick="openModal('aqidah')" 
        style="background:#222;color:var(--gold);border:none;padding:14px;width:100%;margin-top:12px;border-radius:8px;">
        READ MORE
        </button>
    </div>
</div>

<!-- Jihad -->
<div class="card">
    <div class="card-img" style="background-image:url('image3.jpg');"></div>
    <div style="padding:20px;">
        <h3 style="color:var(--gold);">Jihad Fee-Sabilillah<br><small style="color:#aaa;">জিহাদ ফি সাবিলিল্লাহ</small></h3>
        <button onclick="openModal('jihad')" 
        style="background:#222;color:var(--gold);border:none;padding:14px;width:100%;margin-top:12px;border-radius:8px;">
        READ MORE
        </button>
    </div>
</div>

</div>

<footer style="text-align:center;padding:40px 20px;color:#888;border-top:2px solid #222;">
    <h3 style="color:var(--gold);">VOICE OF DRAGON KINGS</h3>
    <p style="margin:20px 0;">
        <a href="https://t.me/DRAGONETHICALZONE" style="color:var(--gold);">Telegram</a> |
        <a href="https://www.facebook.com/share/17pw6C2Btz/" style="color:var(--gold);">Facebook</a>
    </p>
    
    <audio controls loop style="width:100%;max-width:320px;">
        <source src="song.mp3" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>
    
    <p style="margin-top:25px;font-size:14px;">© 2025 VOICE OF DRAGON KINGS</p>
</footer>

<!-- Modal -->
<div id="myModal" class="modal">
    <div class="modal-content">
        <span onclick="closeModal()" style="float:right;font-size:28px;cursor:pointer;color:var(--gold);">&times;</span>
        <p id="modalText" style="margin-top:20px;line-height:1.6;"></p>
    </div>
</div>

<script>
function openModal(id){
    let text = "";
    if(id === "tawhid"){
        text = "তাওহীদ হলো আল্লাহর একত্বে বিশ্বাস করা। আল্লাহ এক এবং তাঁর কোনো শরিক নেই।";
    }
    else if(id === "aqidah"){
        text = "আকীদাহ হলো ইসলামের মৌলিক বিশ্বাসসমূহ, যা একজন মুসলিমের বিশ্বাসের ভিত্তি।";
    }
    else if(id === "jihad"){
        text = "জিহাদ শব্দের অর্থ চেষ্টা বা সংগ্রাম। ইসলামী শিক্ষায় এটি ন্যায়ের পথে চেষ্টা ও আত্মশুদ্ধির বিষয় হিসেবেও ব্যাখ্যা করা হয়।";
    }
    document.getElementById("modalText").innerHTML = text;
    document.getElementById("myModal").style.display = "flex";
}

function closeModal(){
    document.getElementById("myModal").style.display = "none";
}
</script>

</body>
</html>
